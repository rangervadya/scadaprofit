server {
    listen 80;
    server_name _;
    client_max_body_size 512m;
    proxy_connect_timeout 20s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /vdgo {
        return 308 /vdgo/;
    }

    # Reuse the main app's session and role check for protected VDGO APIs.
    # The SPA itself is served to all authenticated roles; its route guards hide staff-only pages.
    location = /_workforce_auth_vdgo {
        internal;
        proxy_pass http://app:3000/api/auth/check-vdgo;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host $host;
    }

    location = /vdgo/legacy {
        auth_request /_workforce_auth_vdgo;
        proxy_pass http://vdgo-backend:8765/legacy;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location = /vdgo/health {
        auth_request /_workforce_auth_vdgo;
        proxy_pass http://vdgo-backend:8765/health;
        proxy_set_header Host $host;
    }

    location /vdgo/api/ {
        auth_request /_workforce_auth_vdgo;
        proxy_pass http://vdgo-backend:8765/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location ~ ^/vdgo/(generate|generate_docx|preview)$ {
        auth_request /_workforce_auth_vdgo;
        rewrite ^/vdgo/(.*)$ /$1 break;
        proxy_pass http://vdgo-backend:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # Static React bundle: all roles (including fitters) must be able to load
    # the login screen and their personal team workspace. Protected APIs below
    # still pass through auth_request and enforce role permissions.
    location /vdgo/ {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Synchronous Qwen/OCR analysis may run up to PYTHON_JOB_TIMEOUT_MS
    # (90 minutes by default). Keep the gateway alive long enough for the
    # application to return its result or its own timeout response.
    location = /api/analyze {
        proxy_pass http://app:3000;
        proxy_read_timeout 5500s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }
}
