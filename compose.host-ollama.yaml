# Optional: app in Docker, reusing the existing Ollama service/model on the Ubuntu host.
# On Linux, host networking allows the container to reach Ollama on 127.0.0.1:11434
# and the app to listen directly on host port 3001.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    network_mode: host
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOST: "0.0.0.0"
      QWEN_MODEL: "qwen2.5vl:3b"
      OLLAMA_CHAT_URL: "http://127.0.0.1:11434/api/chat"
      OLLAMA_TAGS_URL: "http://127.0.0.1:11434/api/tags"
      PYTHON_BIN: "/opt/venv/bin/python"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    security_opt:
      - no-new-privileges:true
