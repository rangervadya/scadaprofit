openapi: 3.0.3
info:
  title: ScadaProfit API
  version: "1.0.0"
  description: |
    HTTP API для ScadaProfit. Версионирование путей (/api/v1) сознательно не
    применяется; контракт стабилизируется через этот документ и contract-тесты
    (`tests/node/openapi.test.js`).

    Единый формат ошибки:
    ```json
    { "error": "human readable message", "code": "MACHINE_CODE", "details": { } }
    ```
    Поле `error` всегда строка (обратная совместимость), `code` — стабильный
    машинный код, `details` — опциональные детали.

servers:
  - url: /
    description: Текущий хост

tags:
  - name: health
  - name: auth
  - name: workforce
  - name: address
  - name: manual-cad
  - name: jobs
  - name: settings
  - name: vdgo

paths:
  /api/health:
    get:
      tags: [health]
      summary: Liveness
      responses:
        "200":
          description: Сервис жив
          content:
            application/json:
              schema:
                type: object
                required: [ok, service, version]
                properties:
                  ok: { type: boolean, enum: [true] }
                  service: { type: string }
                  version: { type: string }
                  generatedAt: { type: string }

  /api/readyz:
    get:
      tags: [health]
      summary: Readiness (Ollama + модель + Tesseract)
      responses:
        "200":
          description: Все зависимости готовы
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, enum: [true] }
                  model: { type: string }
                  service: { type: string }
                  generatedAt: { type: string }
        "503":
          description: Есть недоступные зависимости
          content:
            application/json:
              schema:
                type: object
                required: [ok, checks]
                properties:
                  ok: { type: boolean, enum: [false] }
                  checks:
                    type: object
                    required: [ollama, model, tesseract]
                    properties:
                      ollama: { type: boolean }
                      model: { type: boolean }
                      tesseract: { type: boolean }

  /api/auth/status:
    get:
      tags: [auth]
      summary: Статус первоначальной настройки
      responses:
        "200":
          description: Готово
          content:
            application/json:
              schema:
                type: object
                required: [ok, setupRequired]
                properties:
                  ok: { type: boolean }
                  setupRequired: { type: boolean }

  /api/auth/setup:
    post:
      tags: [auth]
      summary: Первичная настройка (создание администратора)
      responses:
        "201": { description: Создан }
        "400": { description: Невалидные данные }
        "409": { description: Настройка уже выполнена }
        "429": { description: Слишком много попыток }

  /api/auth/login:
    post:
      tags: [auth]
      summary: Вход
      responses:
        "200":
          description: Успешный вход
          content:
            application/json:
              schema:
                type: object
                required: [ok, user]
                properties:
                  ok: { type: boolean }
                  user: { $ref: "#/components/schemas/User" }
        "401": { description: Неверные данные }
        "429": { description: Слишком много попыток }

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Выход
      responses:
        "200": { description: Готово }

  /api/auth/me:
    get:
      tags: [auth]
      summary: Текущая сессия
      responses:
        "200":
          description: Данные текущего пользователя
          content:
            application/json:
              schema:
                type: object
                required: [ok, user]
                properties:
                  ok: { type: boolean }
                  user: { $ref: "#/components/schemas/User" }
        "401": { description: Не авторизован }

  /api/auth/check-vdgo:
    get:
      tags: [auth]
      summary: Проверка авторизации для VDGO (204)
      responses:
        "204": { description: Доступ разрешён }
        "401": { description: Не авторизован }

  /api/workforce/tasks:
    get:
      tags: [workforce]
      summary: Список заданий (по роли)
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                type: object
                required: [ok, tasks]
                properties:
                  ok: { type: boolean }
                  tasks: { type: array, items: { type: object } }
        "401": { description: Не авторизован }
    post:
      tags: [workforce]
      summary: Создать задание (идемпотентно по Idempotency-Key)
      parameters:
        - name: Idempotency-Key
          in: header
          schema: { type: string }
      responses:
        "201": { description: Создано }
        "400": { description: Валидация }
        "409": { description: Конфликт назначения }

  /api/workforce/tasks/{id}/start:
    post:
      tags: [workforce]
      summary: Начать задание
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200": { description: Обновлено }
        "404": { description: Не найдено }

  /api/workforce/tasks/{id}/visit:
    post:
      tags: [workforce]
      summary: Отметить визит
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200": { description: Отмечено }
        "404": { description: Не найдено }

  /api/workforce/tasks/{id}/office:
    post:
      tags: [workforce]
      summary: Обработка в офисе
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200": { description: Обновлено }
        "404": { description: Не найдено }

  /api/workforce/tasks/{taskId}/conclusion:
    post:
      tags: [workforce]
      summary: Добавить задание в заключение
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Добавлено }

  /api/workforce/reports:
    get:
      tags: [workforce]
      summary: Список отчётов (эскизы)
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                type: object
                required: [ok, reports]
                properties:
                  ok: { type: boolean }
                  reports: { type: array, items: { type: object } }
                  unreadCount: { type: integer }

  /api/workforce/reports/{id}/seen:
    post:
      tags: [workforce]
      summary: Отметить отчёт прочитанным
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200": { description: Отмечено }

  /api/workforce/reports/{id}/review:
    post:
      tags: [workforce]
      summary: Рецензировать отчёт
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200": { description: Рецензировано }

  /api/workforce/reports/{id}/conclusion:
    post:
      tags: [workforce]
      summary: Добавить отчёт в заключение
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200": { description: Добавлено }

  /api/workforce/reports/{reportId}/files/{fileId}:
    get:
      tags: [workforce]
      summary: Скачать файл отчёта
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string }
        - name: fileId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Файл }
        "404": { description: Не найден }

  /api/workforce/defects:
    get:
      tags: [workforce]
      summary: Список报告ов о дефектах
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                type: object
                required: [ok, reports]
                properties:
                  ok: { type: boolean }
                  reports: { type: array, items: { type: object } }
                  unreadCount: { type: integer }

  /api/workforce/defects/{id}/seen:
    post:
      tags: [workforce]
      summary: Отметить дефект прочитанным
      parameters:
        - $ref: "#/components/parameters/DefectId"
      responses:
        "200": { description: Отмечено }

  /api/workforce/defects/{id}/review:
    post:
      tags: [workforce]
      summary: Рецензировать дефект
      parameters:
        - $ref: "#/components/parameters/DefectId"
      responses:
        "200": { description: Рецензировано }

  /api/workforce/defects/{id}/conclusion:
    post:
      tags: [workforce]
      summary: Добавить дефект в заключение
      parameters:
        - $ref: "#/components/parameters/DefectId"
      responses:
        "200": { description: Добавлено }

  /api/workforce/defects/{reportId}/files/{fileId}:
    get:
      tags: [workforce]
      summary: Скачать файл дефекта
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string }
        - name: fileId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Файл }
        "404": { description: Не найден }

  /api/workforce/conclusion:
    get:
      tags: [workforce]
      summary: Контекст заключения
      parameters:
        - name: task
          in: query
          schema: { type: string }
        - name: report
          in: query
          schema: { type: string }
        - name: defectReport
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Контекст
          content:
            application/json:
              schema:
                type: object
                required: [ok]

  /api/workforce/overview:
    get:
      tags: [workforce]
      summary: Сводка по рабочему пространству
      responses:
        "200":
          description: Сводка
          content:
            application/json:
              schema:
                type: object
                required: [ok]

  /api/workforce/users:
    get:
      tags: [workforce]
      summary: Список пользователей
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                type: object
                required: [ok, users]
                properties:
                  ok: { type: boolean }
                  users: { type: array, items: { type: object } }
    post:
      tags: [workforce]
      summary: Создать пользователя
      responses:
        "201": { description: Создан }
        "409": { description: Дубликат }

  /api/workforce/users/{id}:
    patch:
      tags: [workforce]
      summary: Обновить пользователя
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Обновлён }
        "404": { description: Не найден }

  /api/workforce/users/{id}/reset-password:
    post:
      tags: [workforce]
      summary: Сбросить пароль пользователя
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { description: Сброшен }

  /api/workforce/admin/diagnostics:
    get:
      tags: [workforce]
      summary: Диагностика (админ)
      responses:
        "200":
          description: Диагностика
          content:
            application/json:
              schema:
                type: object

  /api/library:
    get:
      tags: [address]
      summary: Справочник адресов
      responses:
        "200":
          description: Справочник
          content:
            application/json:
              schema:
                type: object

  /api/library/streets:
    post:
      tags: [address]
      summary: Добавить улицу
      responses:
        "200": { description: Добавлено }

  /api/library/buildings:
    post:
      tags: [address]
      summary: Добавить дом
      responses:
        "200": { description: Добавлено }

  /api/library/schemes/upload:
    post:
      tags: [address]
      summary: Загрузить схему
      responses:
        "200": { description: Загружено }

  /api/library/schemes/{jobId}:
    get:
      tags: [address]
      summary: Получить схему
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200": { description: Схема }
        "404": { description: Не найдена }
    post:
      tags: [address]
      summary: Обновить схему
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200": { description: Обновлено }

  /api/library/schemes/{jobId}/status:
    get:
      tags: [address]
      summary: Статус обработки схемы
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200": { description: Статус }

  /api/library/schemes/{jobId}/analyze:
    post:
      tags: [address]
      summary: Запустить анализ схемы
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "202": { description: Принято }

  /api/manual-cad/projects:
    get:
      tags: [manual-cad]
      summary: Список проектов ручного CAD
      responses:
        "200":
          description: Список
          content:
            application/json:
              schema:
                type: object
                required: [projects]
    post:
      tags: [manual-cad]
      summary: Создать проект
      responses:
        "201": { description: Создан }

  /api/manual-cad/projects/{id}:
    get:
      tags: [manual-cad]
      summary: Карточка проекта
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Проект }
        "404": { description: Не найден }
    put:
      tags: [manual-cad]
      summary: Обновить проект
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Обновлён }

  /api/manual-cad/projects/{id}/source:
    get:
      tags: [manual-cad]
      summary: Исходник проекта
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: Исходник }

  /api/manual-cad/projects/{id}/preview.svg:
    get:
      tags: [manual-cad]
      summary: SVG-превью
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: SVG }

  /api/manual-cad/projects/{id}/export.svg:
    get:
      tags: [manual-cad]
      summary: Экспорт SVG
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: SVG }

  /api/manual-cad/projects/{id}/export.dxf:
    get:
      tags: [manual-cad]
      summary: Экспорт DXF
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200": { description: DXF }

  /api/manual-cad/import-job/{jobId}:
    post:
      tags: [manual-cad]
      summary: Импорт задания
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200": { description: Импортировано }

  /api/manual-cad/import-source-job/{jobId}:
    post:
      tags: [manual-cad]
      summary: Импорт исходника задания
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200": { description: Импортировано }

  /api/manual-cad/import-workforce-report/{reportId}:
    post:
      tags: [manual-cad]
      summary: Импорт отчёта
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200": { description: Импортировано }

  /api/jobs/{jobId}/graph:
    get:
      tags: [jobs]
      summary: Граф задания
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200": { description: Граф }

  /api/jobs/{jobId}/connections:
    post:
      tags: [jobs]
      summary: Обновить связи задания
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200": { description: Обновлено }

  /api/jobs/{jobId}/review:
    post:
      tags: [jobs]
      summary: Рецензировать задание
      parameters:
        - $ref: "#/components/parameters/JobId"
      responses:
        "200": { description: Рецензировано }

  /api/analyze:
    post:
      tags: [vdgo]
      summary: Анализ вариативной части (Node → vdgo-backend)
      responses:
        "200": { description: Результат анализа }
        "422": { description: Не удалось разобрать изображение }
        "429": { description: Сервис занят }
        "500": { description: Внутренняя ошибка }

  /api/template:
    get:
      tags: [settings]
      summary: Получить шаблон
      responses:
        "200": { description: Шаблон }
    post:
      tags: [settings]
      summary: Загрузить шаблон
      responses:
        "200": { description: Загружен }
    delete:
      tags: [settings]
      summary: Удалить шаблон
      responses:
        "200": { description: Удалён }

  /api/template/file:
    get:
      tags: [settings]
      summary: Скачать файл шаблона
      responses:
        "200": { description: Файл }

  /api/moss-settings:
    get:
      tags: [settings]
      summary: Настройки MOSS
      responses:
        "200": { description: Настройки }
    put:
      tags: [settings]
      summary: Обновить настройки MOSS
      responses:
        "200": { description: Обновлено }
    delete:
      tags: [settings]
      summary: Удалить настройки MOSS
      responses:
        "200": { description: Удалено }

  /api/moss-settings/test:
    post:
      tags: [settings]
      summary: Проверить подключение MOSS
      responses:
        "200": { description: Результат проверки }

  /api/openrouter-settings:
    get:
      tags: [settings]
      summary: Настройки OpenRouter
      responses:
        "200": { description: Настройки }
    put:
      tags: [settings]
      summary: Обновить настройки OpenRouter
      responses:
        "200": { description: Обновлено }
    delete:
      tags: [settings]
      summary: Удалить настройки OpenRouter
      responses:
        "200": { description: Удалено }

  /api/openrouter-settings/test:
    post:
      tags: [settings]
      summary: Проверить подключение OpenRouter
      responses:
        "200": { description: Результат проверки }

  /vdgo/generate:
    post:
      tags: [vdgo]
      summary: Генерация PDF (nginx → vdgo-backend:8765)
      responses:
        "200": { description: Сформированный PDF }
        "429": { description: Сервис занят }

  /vdgo/generate_docx:
    post:
      tags: [vdgo]
      summary: Генерация DOCX (nginx → vdgo-backend:8765)
      responses:
        "200": { description: Сформированный DOCX }
        "429": { description: Сервис занят }

  /vdgo/preview:
    post:
      tags: [vdgo]
      summary: Предпросмотр PDF (nginx → vdgo-backend:8765)
      responses:
        "200": { description: Предпросмотр PDF }
        "429": { description: Сервис занят }

components:
  parameters:
    TaskId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ReportId:
      name: id
      in: path
      required: true
      schema: { type: string }
    DefectId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ProjectId:
      name: id
      in: path
      required: true
      schema: { type: string }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }

  schemas:
    User:
      type: object
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { type: string }
        accessLevel: { type: string }
        active: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
        code: { type: string }
        details: { type: object, nullable: true }