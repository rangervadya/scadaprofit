services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: vdgo-frontend:5.3.7
    environment:
      NODE_ENV: production
      PORT: "4173"
    restart: unless-stopped
    expose:
      - "4173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      backend:
        condition: service_started

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: vdgo-backend:5.3.9
    environment:
      VDGO_HOST: 0.0.0.0
      VDGO_PORT: "8765"
      DB_REQUIRED: "1"
      VDGO_DOCKER: "1"
      DB_WAIT_SECONDS: "60"
      DATABASE_URL: postgresql://${POSTGRES_USER:-vdgo_app}:${POSTGRES_PASSWORD:-change_me_vdgo_2026}@db:5432/${POSTGRES_DB:-vdgo}
    restart: unless-stopped
    expose:
      - "8765"
    volumes:
      - vdgo-output:/app/output
      - vdgo-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  db:
    image: postgres:17.7-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vdgo}
      POSTGRES_USER: ${POSTGRES_USER:-vdgo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_vdgo_2026}
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  nginx:
    image: nginx:1.28.2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${VDGO_HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  vdgo-output:
  vdgo-uploads:
