[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = [
  "services/vdgo/output",
  "services/vdgo/uploads",
  "tests/fixtures",
  "services/ollama/engine/__pycache__",
  "services/vdgo/__pycache__",
]

[tool.ruff.lint]
# E7 includes E701/E702 (the engine intentionally uses compact one-line
# statements). F841/B007/B904 are legacy cleanup tracked in P2-10.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E501", "E701", "E702", "B008", "B905", "B007", "B904", "F841"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
"services/ollama/engine/moss_ai.py" = ["E402"]
"services/ollama/engine/openrouter_ai.py" = ["E402"]
"services/vdgo/pdf_to_docx_editable.py" = ["E402"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"