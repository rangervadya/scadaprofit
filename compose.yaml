# Every service writes JSON lines to stdout/stderr. These limits keep the
# default json-file driver from growing without bound: the recognition engine
# emits one progress event per Qwen tile and jobs can run for 90 minutes.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  # Local vision service for handwriting OCR and semantic pipe centre-line tracing.
  # OpenCV candidates remain available for review if the vision model is unavailable.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    init: true
    logging: *default-logging
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NO_CLOUD: "true"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: infra/docker/app.Dockerfile
    restart: unless-stopped
    init: true
    logging: *default-logging
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      LOG_LEVEL: "${LOG_LEVEL:-info}"
      PORT: "3000"
      TRUST_GATEWAY_PROXY: "1"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      HOST: "0.0.0.0"
      MASK_PYTHON: "/opt/venv/bin/python"
      PYTHON_JOB_TIMEOUT_MS: "5400000"
      DATA_DIR: "/data/cad-reconstruction-jobs"
      OLLAMA_CHAT_URL: "http://ollama:11434/api/chat"
      OLLAMA_TAGS_URL: "http://ollama:11434/api/tags"
      QWEN_MODEL: "${QWEN_MODEL:-qwen3-vl:4b-instruct}"
      OSD_MIN_ORIENTATION_CONFIDENCE: "${OSD_MIN_ORIENTATION_CONFIDENCE:-8.0}"
      OSD_MIN_SCRIPT_CONFIDENCE: "${OSD_MIN_SCRIPT_CONFIDENCE:-2.0}"
      QWEN_KEEP_ALIVE: "${QWEN_KEEP_ALIVE:-30s}"
      QWEN_NUM_CTX: "${QWEN_NUM_CTX:-4096}"
      QWEN_NUM_BATCH: "${QWEN_NUM_BATCH:-96}"
      QWEN_NUM_THREADS: "${QWEN_NUM_THREADS:-2}"
      QWEN_MAX_IMAGE_EDGE: "${QWEN_MAX_IMAGE_EDGE:-1280}"
      QWEN_OCR_TIMEOUT: "${QWEN_OCR_TIMEOUT:-105}"
      QWEN_TILE_RETRY_BUDGET: "0"
      QWEN_OCR_MAX_TOKENS: "${QWEN_OCR_MAX_TOKENS:-1024}"
      QWEN_OCR_TILE_GRID: "${QWEN_OCR_TILE_GRID:-2}"
      QWEN_OCR_UPSCALE: "${QWEN_OCR_UPSCALE:-1.25}"
      QWEN_PIPE_TRACE_TIMEOUT: "${QWEN_PIPE_TRACE_TIMEOUT:-105}"
      QWEN_PIPE_MAX_TOKENS: "${QWEN_PIPE_MAX_TOKENS:-1024}"
      QWEN_PIPE_TILE_GRID: "${QWEN_PIPE_TILE_GRID:-2}"
      QWEN_PIPE_UPSCALE: "${QWEN_PIPE_UPSCALE:-1.0}"
      QWEN_PIPE_TILE_OVERLAP: "${QWEN_PIPE_TILE_OVERLAP:-0.12}"
      QWEN_PIPE_MAX_IMAGE_EDGE: "${QWEN_PIPE_MAX_IMAGE_EDGE:-1280}"
      QWEN_PIPE_MIN_CONFIDENCE: "${QWEN_PIPE_MIN_CONFIDENCE:-30}"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - cad_jobs:/data/cad-reconstruction-jobs
    security_opt:
      - no-new-privileges:true

  vdgo-backend:
    build:
      context: ./services/vdgo
      dockerfile: Dockerfile
    image: vdgo-backend:5.3.9
    logging: *default-logging
    environment:
      VDGO_HOST: 0.0.0.0
      VDGO_PORT: "8765"
      VDGO_DOCKER: "1"
      DB_REQUIRED: "1"
      DB_WAIT_SECONDS: "60"
      LOG_LEVEL: "${VDGO_LOG_LEVEL:-info}"
      APP_RELEASE: "${APP_RELEASE:-4.5.17}"
      DATABASE_URL: postgresql://${POSTGRES_USER:-vdgo_app}:${POSTGRES_PASSWORD:-change_me_vdgo_2026}@vdgo-db:5432/${POSTGRES_DB:-vdgo}
    expose:
      - "8765"
    volumes:
      - vdgo_output:/app/output
      - vdgo_uploads:/app/uploads
    restart: unless-stopped
    depends_on:
      vdgo-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  vdgo-db:
    image: postgres:17.7-alpine
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vdgo}
      POSTGRES_USER: ${POSTGRES_USER:-vdgo_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_vdgo_2026}
    volumes:
      - vdgo_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  gateway:
    image: nginx:1.28.2-alpine
    logging: *default-logging
    ports:
      - "${WEB_PORT:-3001}:80"
    volumes:
      - ./infra/nginx/nginx-unified.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      vdgo-backend:
        condition: service_healthy

volumes:
  cad_jobs:
  ollama_data:
  vdgo_output:
  vdgo_uploads:
  vdgo_postgres_data:
