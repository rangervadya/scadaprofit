services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    init: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_NO_CLOUD: "true"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  model-init:
    profiles: ["ai-setup"]
    image: ollama/ollama:latest
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      QWEN_MODEL: "${QWEN_MODEL:-qwen3-vl:4b-instruct}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        echo "Checking Ollama model: $${QWEN_MODEL}"
        if ollama list | awk 'NR > 1 {print $$1}' | grep -Fxq "$${QWEN_MODEL}"; then
          echo "Model $${QWEN_MODEL} is already present."
        else
          echo "Model is missing; pulling it into the persistent Docker volume..."
          ollama pull "$${QWEN_MODEL}"
        fi

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      QWEN_MODEL: "${QWEN_MODEL:-qwen3-vl:4b-instruct}"
      OLLAMA_CHAT_URL: "http://ollama:11434/api/chat"
      OLLAMA_TAGS_URL: "http://ollama:11434/api/tags"
      PYTHON_BIN: "/opt/venv/bin/python"
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=512m
    security_opt:
      - no-new-privileges:true

volumes:
  ollama_data:
