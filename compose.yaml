services:
  # Local vision service for handwriting OCR and semantic pipe centre-line tracing.
  # OpenCV candidates remain available for review if the vision model is unavailable.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    init: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_NO_CLOUD: "true"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_PORT:-3001}:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      MASK_PYTHON: "/opt/venv/bin/python"
      DATA_DIR: "/tmp/cad-reconstruction-jobs"
      OLLAMA_CHAT_URL: "http://ollama:11434/api/chat"
      OLLAMA_TAGS_URL: "http://ollama:11434/api/tags"
      QWEN_MODEL: "${QWEN_MODEL:-qwen3-vl:4b}"
      QWEN_OCR_TIMEOUT: "40"
      QWEN_OCR_TILE_GRID: "2"
      QWEN_OCR_UPSCALE: "2.0"
      QWEN_PIPE_TRACE_TIMEOUT: "150"
      QWEN_PIPE_MAX_IMAGE_EDGE: "2048"
      QWEN_PIPE_MIN_CONFIDENCE: "68"
    security_opt:
      - no-new-privileges:true

volumes:
  ollama_data:
